source: Derived by aligning the LIVE MCP tools/list (mcp/numbers-online-mcp-tools-list.json, 4 tools, anonymous 200) and the A2A agent card skills (a2a/, same 4 ids) with the provider OpenAPI 3.0.3 (openapi/numbers-online-openapi.yml, 56 operations). Confidence per row; nothing mapped that does not exist in both.
purpose: Bind each agent-facing tool to the REST operation(s) that back it so the tool inherits a real request contract, and record where the three surfaces diverge. The MCP inputSchemas here are the live, provider-served schemas — not guessed.
