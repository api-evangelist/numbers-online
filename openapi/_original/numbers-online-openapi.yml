    note: 'Verbatim harvest of the provider-published OpenAPI 3.0.3 (56 operations, 24 schemas). The JSON original is archived at openapi/_original/numbers-online-openapi.json; this file is the same document serialized as YAML. Ownership: servers[0] is https://numbers.online, info.contact.url is https://numbers.online, and the provider llms.txt/robots.txt/docs all name /api/spec as the source of truth.'
servers:
- url: https://numbers.online
  description: Production server
- url: http://localhost:3000
  description: Development server
tags:
- name: Account
  description: 'Self-service API account: signup, balance, usage, credit top-ups, and the key lifecycle. Account-management endpoints require an account-level key with the ''manage'' use case (every self-service key holds it unless deliberately narrowed; the per-key signing config is exempt).'
- name: Parsing
  description: Phone number parsing and validation endpoints
- name: Lookup
  description: 'Number lookup: line type, range carrier, CNAM, verstat, and a supplementary spam signal'
- name: PBX
  description: Plain-text caller-id lookup for header-less PBX integrations (FreeSWITCH mod_cidlookup and similar)
- name: Inbound
  description: Inbound caller-intelligence lookup for operators, PBX, and softphones
- name: Outbound
  description: Outbound pre-call checks (scrub + call-provenance) and number enrollment for spoofing-defense
- name: Community reporting
  description: Key-gated spam/scam reporting — the give-to-get half of the community sensor (receipt-gated, tags-only, lane-scoped supplementary signals)
- name: MCP
  description: 'Model Context Protocol server for AI voice agents (Vapi, Retell, Pipecat, LiveKit): read-only phone-intelligence tools over Streamable HTTP'
- name: Webhooks
  description: AI-voice-agent webhook adapters (Retell inbound, Vapi custom tool) over the same lookup backend
- name: SBC / SIP
  description: SIP redirect-server decisions for session border controllers (Kamailio, OpenSIPS, dSIPRouter, Sansay, Oracle/Acme Packet, ProSBC) via the operator-run shim recipe, plus an FCC robocall-mitigation evidence bundle — a supplementary call-setup signal, fail-open
- name: Trust
  description: Contact-suppression preference lookups
- name: MSP
  description: 'Multi-tenant control plane: per-tenant sub-keys, usage rollups, and suppression lists for MSPs and PBX resellers'
- name: Receipts
  description: Signed, privacy-safe lookup receipts (Ed25519) — verifiable "checked as of T" evidence
- name: Reference
  description: Reference data and examples
- name: System
  description: Operational endpoints (health checks)
paths:
  /api/v1/parse:
    post:
      tags:
      - Parsing
      summary: Parse a phone number
      description: Parse and validate a single phone number, returning format variants, country, line type, and validity. Deterministic and free (priced $0; counted for analytics only). Requires an API key with the `parse` use case. The legacy `/api/parse` path is a frozen alias of this endpoint with a `{success:}` envelope.
      operationId: v1Parse
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  description: The phone number to parse (E.164 format recommended)
                  example: '+14155552671'
                defaultCountry:
                  type: string
                  description: Default country code (ISO 3166-1 alpha-2) for numbers without country code
                  example: US
      responses:
        '200':
          description: Parsed phone number (schema_version-stamped parse row).
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    schema_version:
                      type: string
                      example: '2026-06-18'
                - $ref: '#/components/schemas/ParsedPhoneNumber'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/parse/batch:
    post:
      tags:
      - Parsing
      summary: Parse multiple phone numbers
      description: 'Parse and validate up to 100 numbers in one request (named `batch` to match `/api/v1/lookup/batch`). Non-string entries return a uniform blank row with `valid: false` rather than failing the batch. Deterministic and free (priced $0). Requires the `parse` use case. The legacy `/api/parse/bulk` path is a frozen alias with a `{success:}` envelope.'
      operationId: v1ParseBatch
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phoneNumbers
              properties:
                phoneNumbers:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  description: Array of phone numbers to parse
                  example:
                  - '+14155552671'
                  - '+442071234567'
                  - '+33123456789'
                defaultCountry:
                  type: string
                  description: Default country code for numbers without country code
                  example: US
      responses:
        '200':
          description: Parsed phone numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                    example: '2026-06-19'
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ParsedPhoneNumber'
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      valid:
                        type: integer
                      invalid:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/scrub:
    post:
      tags:
      - Trust
      summary: Scrub a calling list
      description: 'Call-center list cleaning (API-key gated, `scrub` use case). Submit up to 1,000 numbers and an optional channel; for each, receive SUPPRESS (verified owner has a suppression preference — remove it), NO_MATCH (no suppression preference on record), or UNKNOWN (not resolvable). A compliance aid, not a legal determination; NO_MATCH is not consent. Billing (standard tier): $0.001 per number, debited after delivery, idempotent per content-scoped `Idempotency-Key`. Free tier: not billed — draws from an account-pooled allowance counted in NUMBERS (1,000/min and 5,000/day on the free floor; verified business numbers scale it), so a 1,000-number batch costs 1,000 pool units. The legacy `/api/scrub` path is a frozen alias (same dialect; this path adds `schema_version`).'
      operationId: v1Scrub
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'Optional client-supplied request id for at-most-once billing on retries (content-scoped: the same key with a different number list does not dedupe).'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - numbers
              properties:
                numbers:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
                  example:
                  - '+16285550177'
                  - '+12135559988'
                channel:
                  type: string
                  enum:
                  - voice
                  - sms
                  - whatsapp
                  default: voice
                  description: Contact channel to check the suppression preference for.
      responses:
        '200':
          description: Per-number suppression status
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                    example: '2026-06-20'
                  count:
                    type: integer
                  channel:
                    type: string
                    enum:
                    - voice
                    - sms
                    - whatsapp
                  disclaimer:
                    type: string
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      suppress:
                        type: integer
                        description: Numbers with a suppression preference on record
                      no_match:
                        type: integer
                        description: Numbers with no suppression preference (includes opt-ins)
                      unknown:
                        type: integer
                        description: Numbers that could not be resolved
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        input:
                          type: string
                        e164:
                          type: string
                        status:
                          type: string
                          enum:
                          - SUPPRESS
                          - NO_MATCH
                          - UNKNOWN
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/countries:
    get:
      tags:
      - Reference
      summary: List supported countries
      description: Reference list of supported countries with calling codes and example numbers. Free (priced $0). Requires the `parse` use case. The legacy `/api/countries` path is a frozen alias with a `{success:}` envelope.
      operationId: v1Countries
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: List of supported countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                    example: '2026-06-21'
                  count:
                    type: integer
                  countries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/lookup/{e164}:
    get:
      tags:
      - Lookup
      summary: Look up a single number
      description: 'Single-number lookup returning the uniform §2 response shape: deterministic parse fields (validity, formats, line type, range carrier, country) plus cache-aware CNAM, a normalized STIR/SHAKEN verstat, and a supplementary low-confidence spam signal. All enrichment is fail-open — a slow or failing supplier nulls that field rather than erroring. The shape is identical for known and unknown numbers (anti-enumeration). Invalid input returns **200** with `valid: false` and null fields (NOT 404) and is not billed. Requires an API key with the `lookup` use case. Billing (standard tier): `$0.004` when a fresh wholesale CNAM dip is performed, `$0.002` when served without one (CNAM cache hit, or no CNAM supplier configured). The free tier is not billed (rate-limited instead). Billed responses are returned with `Cache-Control: no-store` — the `cached` field and `max_cache_age` param are the cache contract.'
      operationId: lookupNumber
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: e164
        in: path
        required: true
        description: The number to look up, as a full E.164 string (`+14155552671`), its URL-encoded form (`%2B14155552671`), or a bare digit slug (`14155552671`).
        schema:
          type: string
        example: '+14155552671'
      - name: verstat
        in: query
        required: false
        description: STIR/SHAKEN verstat passthrough — a bare token (e.g. `TN-Validation-Passed`), a `verstat=...` parameter, or a full SIP/tel header value. Normalized to `verified` / `unverified` / `unknown` in the response. Absence of validation is NOT a failed validation (maps to `unknown`).
        schema:
          type: string
        example: TN-Validation-Passed
      - name: max_cache_age
        in: query
        required: false
        description: 'Operator TTL control: the maximum acceptable CNAM cache age in seconds. A cached value older than this triggers a fresh wholesale dip; `0` forces a fresh dip (which is billed at the `$0.004` rate).'
        schema:
          type: integer
          minimum: 0
        example: 86400
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied request id for at-most-once billing on retries. Repeated requests with the same key are not double-billed.
        schema:
          type: string
      responses:
        '200':
          description: Lookup result (uniform shape for valid, invalid, known, and unknown numbers).
          headers:
            Cache-Control:
              description: Always `no-store` — the response is per-request and billed.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '400':
          description: Malformed path (not a usable E.164 number)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/lookup/batch:
    post:
      tags:
      - Lookup
      summary: Look up multiple numbers
      description: 'Bulk number lookup for list processing. Submit up to 100 numbers; results are returned in input order, each as the same shape as the single lookup. This is a list-processing surface, not a call-path surface — for large batches the supplier dips run with bounded concurrency and can take seconds. Requires an API key with the `lookup` use case. Billing (standard tier) is per VALID number, split by what was delivered: `$0.004` for each number that triggered a fresh wholesale CNAM dip and `$0.002` for each served without one; invalid numbers are free. The free tier is not billed (rate-limited instead). Use the `Idempotency-Key` header for at-most-once billing on retries.'
      operationId: lookupNumberBatch
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-supplied request id for at-most-once billing on retries.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - numbers
              properties:
                numbers:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Numbers to look up (E.164 recommended). Maximum 100 per request.
                  example:
                  - '+14155552671'
                  - '+442071234567'
                verstat:
                  type: string
                  description: STIR/SHAKEN verstat passthrough applied to every number in the batch. Same accepted forms as the single-lookup query param.
                  example: TN-Validation-Passed
                max_cache_age:
                  type: integer
                  minimum: 0
                  description: 'Operator TTL control: maximum acceptable CNAM cache age in seconds; `0` forces a fresh dip.'
                  example: 86400
      responses:
        '200':
          description: Per-number lookup results plus a batch billing summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupBatchResponse'
        '400':
          description: Invalid request (missing/empty `numbers`, over 100, or malformed JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/lookup/changes:
    get:
      tags:
      - Lookup
      summary: Reputation-change feed
      description: 'Poll the numbers whose scraped-intel rollup was updated since a cursor, so cached lookups can be refreshed when the underlying intel moves instead of on a blind timer. Returns up to `limit` entries ordered by update time (ascending) plus a `cursor` — pass it as the next request''s `since`; with no `since`, returns the last hour. Two caveats to build against: (1) an entry means the number''s intel row was re-written by ingestion, which includes re-observations that left every value unchanged — treat it as a refresh hint, not proof of movement; (2) ingest batches stamp many rows with one identical update timestamp and the cursor is a strict greater-than, so a page boundary landing inside such a batch skips its remaining same-timestamp rows — use `limit=1000` (the maximum) so pages rarely split a batch. The values are the intel layer''s own signal, a re-dip HINT: the authoritative blended score is still `GET /api/v1/lookup/{e164}`, so the intended loop is poll changes →
        re-dip the numbers you care about, while still honoring the Terms §7 caching bounds (refresh or drop cached responses within 30 days even when no entry arrives). Not separately metered — it rides the account''s normal API access and per-key rate limits. Requires the `lookup` use case.'
      operationId: lookupChanges
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: since
        in: query
        required: false
        description: ISO-8601 cursor — use the previous response's `cursor`. Defaults to one hour ago.
        schema:
          type: string
          format: date-time
        example: '2026-08-01T00:00:00.000Z'
      - name: limit
        in: query
        required: false
        description: Maximum changes per page (default 100, max 1000).
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: Numbers whose intel reputation changed since the cursor, oldest change first.
          headers:
            Cache-Control:
              description: Always `no-store` — the feed is a live cursor read.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  since:
                    type: string
                    format: date-time
                    description: The cursor this page was read from.
                  cursor:
                    type: string
                    format: date-time
                    description: The max change time in this page — pass as the next request's `since`.
                  count:
                    type: integer
                  has_more:
                    type: boolean
                    description: True when the page filled `limit`; poll again immediately with `cursor`. Prefer `limit=1000` so a page boundary rarely lands inside one ingest batch (see the endpoint description).
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        e164:
                          type: string
                          example: '+14155551212'
                        risk_score:
                          type: integer
                          nullable: true
                          description: Intel-layer weighted risk 0–100 (higher = worse) — a supplementary re-dip hint, NOT the blended lookup score.
                        risk_level:
                          type: string
                          enum:
                          - low
                          - medium
                          - high
                          - unknown
                        top_category:
                          type: string
                          nullable: true
                        total_reports:
                          type: integer
                        has_verified_regulator:
                          type: boolean
                        last_observed_at:
                          type: string
                          format: date-time
                          nullable: true
                        changed_at:
                          type: string
                          format: date-time
        '400':
          description: Malformed `since` (must be ISO-8601 — use the previous response's `cursor`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Change feed temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/inbound/lookup:
    post:
      tags:
      - Inbound
      summary: Inbound caller lookup
      description: 'Signed, privacy-safe caller intelligence as a supplementary signal for an inbound call/message event. Returns identity type, a risk score (0-100, higher = worse), evidence signals, and a recommended action. A verified individual returns only "Verified & online" — never a name. Requires an API key with the inbound_lookup use case. Billed per dip on the standard tier ($0.004); free on the free tier (rate-limited, and a high-risk caller is degraded from block_candidate to challenge_or_route). Anti-enumeration: a known and an unknown number return the same 200 shape (found vs no_record). Caller-ID-authentication inputs `verstat` and `attestation` are read at the top level: a supplied value modulates whether this number''s standing applies to THIS call (a verified call trusts our read; a failed validation may indicate spoofing of the number) and, when an auth signal is present, contributes to a corroboration-gated spoofing-prevalence signal accumulated across sources — a supplementary
        signal, never stamped onto the number''s stored standing; absence is not a failed validation. The optional `to` (the receiver''s own number) binds call-provenance. The remaining fields (destination_number, client_type, client_name, the nested stir_shaken object, call_id_hash, timestamp) are accepted but currently reserved and ignored.'
      operationId: inboundLookup
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - number
              properties:
                number:
                  type: string
                  example: '+14155551212'
                context:
                  type: string
                  enum:
                  - inbound_voice
                  - inbound_sms
                  - inbound_waba
                verstat:
                  type: string
                  description: STIR/SHAKEN verstat passthrough — a bare token (e.g. TN-Validation-Passed), a verstat=… parameter, or a full SIP/tel header value; normalized to verified/unverified/unknown. Absence is not a failed validation.
                  example: TN-Validation-Passed
                attestation:
                  type: string
                  enum:
                  - A
                  - B
                  - C
                  description: P-Attestation-Indicator level; an explicit A/B/C overrides verstat.
                to:
                  type: string
                  description: The receiver's own number (E.164). Binds call-provenance so a later spoofing report can be attributed; stored only as a hash.
                  example: '+14155550100'
                destination_number:
                  type: string
                  description: Reserved; accepted but currently ignored.
                client_type:
                  type: string
                  description: Reserved; accepted but currently ignored.
                client_name:
                  type: string
                  description: Reserved; accepted but currently ignored.
                call_id_hash:
                  type: string
                  description: Reserved; accepted but currently ignored.
                timestamp:
                  type: string
                  format: date-time
                  description: Reserved; accepted but currently ignored.
      responses:
        '200':
          description: Signed caller assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundLookupResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/outbound/lookup:
    post:
      tags:
      - Outbound
      summary: Outbound pre-call check (scrub + provenance)
      description: 'An outbound integration''s pre-call check on a destination. Returns the M1 pre-call scrub on `to` (SUPPRESS | NO_MATCH | UNKNOWN) plus three more supplementary signals: a compliance signal; an outbound `dial_risk` read — a low-confidence estimate of the cost/abuse risk of DIALING `to` (premium / satellite / international / IRSF-cover structural prior, plus any dynamic fraud observations); and a `cost_estimate` — the indicative RETAIL cost to reach `to`, priced for BOTH channels (voice per minute, SMS per message) from aggregated provider list-price decks, with a per-provider breakdown. All are supplementary signals, NEVER a consent grant or a block verdict: NO_MATCH is not permission to call and a dial_risk level is not a block — you remain responsible for your own lawful basis and dialing decision. For an ENROLLED caller (a verified business number you enrolled via /api/v1/outbound/enroll), it also records a hashed, short-TTL (from -> to) call-provenance edge: a self-incriminating
        record of who you actually dialled, used at report time to hold your number accountable for calls it DID place and to shield it from reports about calls it did NOT place (spoofing). Both ends are hashed, server-only, and never surfaced. Non-enrolled callers still get the scrub; no edge is written. Requires an API key with the `precall` use case. Free (bundled); not metered. Supplementary signal only — no per-call verdict. This is the canonical spelling — the outbound mirror of /api/v1/inbound/lookup; the original /api/v1/precall/lookup stays a permanent alias served by the same handler.'
      operationId: precallLookup
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              properties:
                to:
                  type: string
                  description: The destination number being called.
                  example: '+14155551212'
                from:
                  type: string
                  description: Your own calling number. A provenance edge is recorded only when this is a number you have enrolled.
                  example: '+442071838750'
                context:
                  type: string
                  enum:
                  - outbound_voice
                  - outbound_sms
                  description: 'The channel you are about to use. Drives which suppression list is scrubbed: outbound_sms scrubs SMS preferences, anything else scrubs voice. Echoed back as `dnc_channel`.'
      responses:
        '200':
          description: Pre-call scrub (+ provenance edge when enrolled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                    example: '2026-06-23'
                  to:
                    type: string
                  dnc:
                    type: string
                    enum:
                    - SUPPRESS
                    - NO_MATCH
                    - UNKNOWN
                  dnc_channel:
                    type: string
                    enum:
                    - voice
                    - sms
                    description: Which suppression list the `dnc` answer was scrubbed against (derived from `context`).
                  dnc_note:
                    type: string
                  compliance:
                    type: object
                    nullable: true
                    properties:
                      dnc_status:
                        type: string
                      reassigned_status:
                        type: string
                  dial_risk:
                    type: object
                    nullable: true
                    description: 'Outbound dial-risk signal: the cost/abuse risk of DIALING `to` (structural prior plus any dynamic fraud observations). Supplementary signal, not a block verdict. Null if scoring failed (fail-open).'
                    properties:
                      risk:
                        type: integer
                        description: Risk score 0–100.
                        example: 6
                      level:
                        type: string
                        enum:
                        - low
                        - medium
                        - high
                        description: 'Banded risk: low (<40), medium (40–69), high (≥70).'
                      model:
                        type: string
                        enum:
                        - dial_structural
                        description: 'Scoring model (§ Risk models): the outbound structural model — NOT the inbound reputation blend.'
                      structural_type:
                        type: string
                        nullable: true
                        enum:
                        - premium_prs
                        - satellite
                        - intl_network
                        - intl_premium
                        - freephone
                        - unallocated_dialable
                        - ordinary
                        description: The structural class the destination resolved to (null if no range matched).
                      reason_codes:
                        type: array
                        items:
                          type: string
                        description: Legible drivers, e.g. `structural:intl_premium` or `dynamic:<source_class>`.
                        example:
                        - structural:intl_premium
                      note:
                        type: string
                  cost_estimate:
                    type: object
                    nullable: true
                    description: Indicative RETAIL cost to reach `to`, from aggregated provider price-list decks (longest-prefix match, filtered by the destination's parsed line type). Returns BOTH channels regardless of `context` — `voice` priced per minute, `sms` per message — each null when no deck covers that channel; the whole object is null when neither does (fail-open). All amounts are decimal USD strings. Supplementary signal, never wholesale interconnect cost and never a quote.
                    properties:
                      currency:
                        type: string
                        enum:
                        - USD
                      note:
                        type: string
                      voice:
                        allOf:
                        - $ref: '#/components/schemas/ChannelCost'
                        nullable: true
                        description: Per-minute voice rate, or null if no voice deck covers the destination.
                      sms:
                        allOf:
                        - $ref: '#/components/schemas/ChannelCost'
                        nullable: true
                        description: Per-message SMS rate, or null if no SMS deck covers the destination.
                  enrolled:
                    type: boolean
                  provenance_recorded:
                    type: boolean
                  provenance_note:
                    type: string
                  edge_id:
                    type: string
                  ttl_seconds:
                    type: integer
                    example: 604800
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/outbound/enroll:
    post:
      tags:
      - Outbound
      summary: Enroll a number for call-provenance
      description: 'Owner-only control that enrolls (or, with `enrolled: false`, revokes) a verified business number you own for call-provenance. Enrollment is your attestation that this number only places calls after a Numbers Online outbound pre-call lookup, so the absence of a matching pre-call edge becomes a supplementary signal that a complaint may concern a spoofed call rather than one you placed. Only numbers bound to your own account can be enrolled; revocable and abuse-monitored. Requires an account-level API key with the `precall` use case (not a tenant sub-key). Supplementary signal only — not a compliance determination. This is the canonical spelling; the original /api/v1/precall/enroll stays a permanent alias served by the same handler. The same toggle is also available resource-shaped: GET /api/v1/account/phones lists your numbers, PATCH /api/v1/account/phones/{e164} flips enrollment.'
      operationId: precallEnroll
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - number
              properties:
                number:
                  type: string
                  example: '+442071838750'
                enrolled:
                  type: boolean
                  default: true
                  description: Set false to revoke enrollment.
      responses:
        '200':
          description: Enrollment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: string
                    example: '2026-06-14'
                  ok:
                    type: boolean
                  number:
                    type: string
                  enrolled:
                    type: boolean
                  attestation:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant sub-keys cannot manage enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Number not bound to your account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/precall/lookup:
