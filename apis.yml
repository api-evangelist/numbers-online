apis:
- aid: numbers-online:numbers-online-mcp-server
  name: Numbers Online MCP Server
  description: >-
    A hosted, stateless, read-only Model Context Protocol server (JSON-RPC 2.0 over Streamable HTTP, protocol
    2025-06-18) at POST https://numbers.online/api/v1/mcp for AI voice agents (Vapi, Retell, Pipecat,
    LiveKit). initialize, ping and tools/list are public; tools/call requires an API key with the mcp
    use case. Live tools/list returns phone_lookup, line_type, caller_risk and dnc_check, each annotated
    readOnlyHint/idempotentHint. Every output is a supplementary, low-confidence signal; the calling agent
    keeps every routing and dialing decision. Billed $0.015 per tool call on the standard tier.
  image: https://numbers.online/android-chrome-512x512.png
  humanURL: https://numbers.online/docs/integrations/ai-voice-agents-mcp
  baseURL: https://numbers.online/api/v1/mcp
