versioning:
  scheme: uri-path + per-shape date-stamped schema_version
  current: v1 (info.version 1.0.0; GET /api/health reports version v1.0.0-307f43d)
  mechanism: 'Canonical paths are the long /api/v1/* form. Every JSON shape carries a schema_version string unique to that shape (e.g. 2026-06-03 for the lookup response, 2026-06-23 for pre-call). Bump rule: additive changes never bump; removing, renaming or retyping a field bumps. Clients must treat schema_version as an open string, never a closed enum.'
  version_classes:
    negotiable: unsigned live responses (lookup, batch, precall, scrub, report, account…) — may advance; additive fields appear without a bump
    stamped: Ed25519-signed artifacts (inbound lookup responses, receipts, evidence bundles) — fixed into the signed bytes at signing time and never renegotiated
  exempt: MCP JSON-RPC frames and the Vapi/Retell vendor webhook shapes (the embedded tool result is versioned instead); /api/v1/cid is plain text and unversioned by design.
  docs: https://numbers.online/api/spec
  changelog: changelog/numbers-online-changelog.yml
deprecation:
  policy_url: https://numbers.online/api/spec
  policy_verbatim: '"the long /api/v1/* paths in this spec are canonical. The bare /v1/* spelling is a tolerated rewrite alias for header-less PBX URL fields only." Each legacy path is described as a "Frozen permanent alias … kept for existing integrations" / "kept forever (it is baked into published guides and agent prompts already in the field)".'
  sunset_header: false
  deprecation_header: false
  sunset_dates_published: false
  posture: 'Aliases are frozen and permanent rather than scheduled for removal: six operations carry deprecated:true in the OpenAPI, all documented as permanent aliases of a canonical v1 operation. Legacy /api/parse, /api/parse/bulk and /api/countries keep a {success:} envelope the v1 paths dropped; /api/scrub already uses the v1 dialect minus schema_version. Frozen field names (spam_score, risk_score) are likewise kept forever alongside the newer risk{} object.'
  note: This is a documented deprecation posture inside the machine-readable contract, not a standalone policy page.
