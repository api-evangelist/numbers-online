codes:
- code: missing_key
  status: 401
  meaning: No API key in the request
  remediation: 'Send Authorization: Bearer nol_… or X-API-Key (or ?key= on the header-less PBX/webhook endpoints).'
- code: invalid_key
  status: 401
  meaning: Key unknown (or revoked — indistinguishable by design)
  remediation: Rotate or mint a new key; a disabled key reads as invalid and cannot be re-enabled.
- code: use_case_forbidden
  status: 403
  meaning: Valid key, not enabled for this endpoint's use case
  remediation: Re-authenticating will not fix a permissions problem; use an account-level key or mint one with the needed use case (lookup, parse, scrub, inbound_lookup, precall, mcp, sbc_redirect, report, manage).
- code: rate_limited_key
  status: 429
  meaning: Per-key per-minute window exceeded
  remediation: Honour Retry-After (seconds); default 60 requests/min per key.
- code: rate_limited_pool
  status: 429
  meaning: Account-pooled budget exhausted (lookups, pre-call, daily reports)
  remediation: Honour Retry-After; verify a business number to raise the pool or add prepaid credit for the standard tier.
- code: rate_limited_ip
  status: 429
  meaning: Too many failed auth attempts from your IP
  remediation: Back off; fix the credential.
- code: signature_invalid
  status: 401
  meaning: Operator request signing required, missing, or failed
  remediation: Sign with the key's HKDF secret from GET /api/v1/account/signing; HMAC-signed requests MUST use the long /api/v1/* path.
- code: insufficient_balance
  status: 402
  meaning: Prepaid balance cannot cover the request — top up
  remediation: Body adds balance_micros, topup_url, topup_min_cents; POST /api/v1/account/topup ($5 minimum).
- code: account_suspended
  status: 403
  meaning: Account suspended by the operator; topping up will not help
  remediation: Contact the provider.
- code: paid_verification_required
  status: 402
  meaning: The remedy is a paid number verification, not a top-up
  remediation: Free accounts may bind exactly one number; verify a business number.
- code: receipt_invalid
  status: 409
  meaning: Missing, already-used, or mismatched receipt_id
  remediation: Mint a fresh single-use receipt via POST /api/v1/inbound/lookup on the same number.
