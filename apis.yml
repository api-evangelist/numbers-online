- aid: numbers-online:numbers-online-phone-intelligence-api
  name: Numbers Online Phone Intelligence API
  description: 'One REST API over a single E.164 primitive: parse and validate numbers, single and bulk lookup (line
    type, range carrier, CNAM, STIR/SHAKEN verstat and a supplementary spam signal), signed inbound caller intelligence
    with single-use receipts, outbound pre-call do-not-contact scrub and call-provenance enrollment, consent-first
    list scrubbing, prepaid accounts and key lifecycle, a ClearIP-compatible SBC/SIP redirect decision, operator
    HMAC signing, a signed FCC robocall-mitigation evidence bundle, and a multi-tenant MSP control plane. Keys are
    self-service (POST /api/v1/account/signup), sent as X-API-Key or Authorization: Bearer; the free tier is rate-limited
    and unbilled, the standard tier is prepaid per dip.'
