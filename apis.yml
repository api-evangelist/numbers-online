- aid: numbers-online:numbers-online-a2a-agent
  name: Numbers Online A2A Agent
  description: >-
    An Agent-to-Agent (A2A protocolVersion 0.3.0, JSONRPC) endpoint at POST https://numbers.online/api/v1/a2a
    exposing four read-only skills — phone_lookup, line_type, caller_risk and dnc_check — the same capabilities
    as the MCP tools. Discovered via the provider-served agent card at /.well-known/agent-card.json (also
    /.well-known/agent.json and /api/agent-card). Bearer API key with the mcp use case; anonymous message/send
    returns 401 missing_key and GET returns 405. This endpoint is not described in the OpenAPI.
