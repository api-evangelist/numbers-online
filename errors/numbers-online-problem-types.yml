channel_specific_contracts:
- surface: GET /api/v1/cid/{number} (cidLookup, cidLookupFallback)
  contract: 'ALWAYS text/plain; every failure (auth, balance, rate limit, unresolvable) is the literal body UNAVAILABLE while the HTTP status stays meaningful (200 / 401 / 402 / 429). Observed: anonymous call → 401 text/plain "UNAVAILABLE".'
- surface: POST /api/v1/integrations/retell/inbound, POST /api/v1/integrations/vapi/tool
  contract: Always HTTP 200 with neutral/empty variables or a graceful result string on failure (a non-2xx would keep the caller ringing).
- surface: POST /api/v1/sbc/redirect
  contract: 'Fail-open: timeout or internal error returns decision=allow; a 603 block only ever follows a deterministic or authoritative fact.'
- surface: POST /api/v1/mcp (tools/call)
  contract: Domain misses come back as a result with isError:true and an LLM-readable message; protocol faults (unknown tool, missing argument) are JSON-RPC -32602; HTTP-level auth failures use the flat error shape.
- surface: POST /api/v1/inbound/lookup
  contract: Fail-open neutral body on internal errors; known and unknown numbers return the same 200 shape (anti-enumeration).
- surface: GET /api/v1/lookup/{e164}
  contract: Invalid input returns 200 with valid:false (not 400) and is not billed.
retry_guidance: '429 → wait Retry-After seconds (also retry_after_seconds in the body). 402 → top up, then retry; billed lookups accept an Idempotency-Key so a retry is not double-billed. 401 invalid_key vs 403 use_case_forbidden are distinct: only the latter is a permissions problem.'
