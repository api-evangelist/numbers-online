conformance:
  spec: A2A 1.0.0 hard checks, applied to a 0.3.0-declared card
  grade: conformant
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: 'capabilities is an OBJECT with streaming, pushNotifications and stateTransitionHistory booleans (pass). protocolVersion is present at the top level as "0.3.0" (pass). skills is an ARRAY of four fully-populated skills, each with id, name, description, tags, examples, inputModes and outputModes (pass). All three optional discriminators are present: preferredTransport JSONRPC, defaultInputModes [text/plain], defaultOutputModes [application/json, text/plain]. The card is internally consistent with the live endpoint: url points at /api/v1/a2a, which answers 405 on GET and 401 missing_key on an anonymous JSON-RPC POST, matching the declared bearer security.'
  deviations:
  - field: protocolVersion / url / preferredTransport
    observed: 0.3.0-era top-level triple rather than the A2A 1.0.0 supportedInterfaces[] shape
    note: Valid for the version the card declares. A reader written strictly against 1.0.0 that looks only for supportedInterfaces[] will find none; a 0.3-aware reader finds everything. Recorded because both shapes coexist in the catalog, not as an error.
  - field: securitySchemes.apiKey
    observed: 'key named apiKey but typed {type: http, scheme: bearer}'
    note: The scheme is an HTTPAuthSecurityScheme carrying an API key as a bearer token; the name is cosmetic. The description states the key needs the "mcp" use case.
  - field: skills[].security
    observed: 'absent; only a top-level security: [{apiKey: []}]'
    note: Every skill inherits the card-level requirement, which is correct for a uniformly key-gated surface, but no per-skill scopes/use-cases are expressed.
  - field: signatures / additionalInterfaces / supportsAuthenticatedExtendedCard
    observed: absent
    note: No JWS signature block, so the card's authenticity rests on TLS to numbers.online. No extended card and no alternative transports declared.
  - field: A2A endpoint vs OpenAPI
    observed: POST /api/v1/a2a is not among the 56 operations in /api/spec, while POST /api/v1/mcp (mcpRpc) is
    note: The A2A surface is a live endpoint that the REST contract does not describe. An agent that discovers the API via the OpenAPI will not learn the A2A endpoint exists; one that discovers it via the card will.
surface_relationship:
  note: 'Numbers Online publishes three agent-facing surfaces over one read-only lookup core. A2A: four skills at https://numbers.online/api/v1/a2a. MCP: the same four capabilities as tools at https://numbers.online/api/v1/mcp (public tools/list, key-gated tools/call; see mcp/numbers-online-mcp.yml). REST: 56 operations at https://numbers.online (see openapi/). The A2A skill ids and the MCP tool names are identical (phone_lookup, line_type, caller_risk, dnc_check), so the card is a faithful projection of the MCP tool set, and both are a narrow read-only subset of the REST contract (no account, key, tenant, report, SBC or evidence operations).'
