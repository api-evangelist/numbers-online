aid: numbers-online
name: Numbers Online
description: 'Numbers Online is a phone-number trust and intelligence service operated by Evergrow Management Pte.
  Ltd. of Singapore. It runs a free public reverse phone lookup with a community-driven, advisory spam-risk score,
  paid number verification for people and businesses, and a B2B API keyed on a single E.164 primitive: parsing and
  validation, single and batch lookup (line type, range carrier, CNAM, STIR/SHAKEN verstat and a low-confidence
  spam signal), signed inbound caller intelligence with Ed25519 receipts, an outbound pre-call do-not-contact scrub
  and call-provenance enrollment, consent-first list scrubbing, a ClearIP-compatible SBC/SIP redirect decision,
  a multi-tenant MSP control plane, and a hosted read-only MCP server plus Vapi/Retell webhooks for AI voice agents.
  The 56-operation REST API is published as an OpenAPI 3.0.3 contract at /api/spec, with an llms.txt, an A2A agent
  card at /.well-known/agent-card.json, markdown mirrors of the docs, and a self-service free tier with no card.'
image: https://numbers.online/android-chrome-512x512.png
url: https://raw.githubusercontent.com/api-evangelist/numbers-online/refs/heads/main/apis.yml
