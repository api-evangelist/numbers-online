crosswalk:
- tool: phone_lookup
  a2a_skill: phone_lookup
  category: lookup
  rest:
  - lookupNumber
  - inboundLookup
  binding: rest
  confidence: medium
  note: The tool bundle = the GET /api/v1/lookup/{e164} fields (validity, formatting, line type, range carrier, country, CNAM, verstat, spam signal via ?verstat= and ?max_cache_age=) PLUS a first-party DNC signal and a signed receipt, which the plain lookup does not mint — receipts come from POST /api/v1/inbound/lookup. The tool is therefore a server-side composite of both; its inputSchema (number, verstat, max_cache_age_seconds) maps 1:1 onto lookupNumber's path + query parameters.
- tool: line_type
  a2a_skill: line_type
  category: lookup
  rest:
  - v1Parse
  - lookupNumber
  binding: rest
  confidence: medium
  note: Deterministic subset only (validity, line type, carrier, country, formatting) with no paid dip — the same fields POST /api/v1/parse returns for free, and the deterministic half of lookupNumber. Input is number only.
- tool: caller_risk
  a2a_skill: caller_risk
  category: risk
  rest:
  - inboundLookup
  binding: rest
  confidence: medium
  note: Spam signal + verstat passthrough + DNC signal + receipt without a name dip — the inbound caller-intelligence shape (risk, receipt_id, signed) minus display_label. Input (number, verstat) maps onto inboundLookup's number + verstat body fields.
- tool: dnc_check
  a2a_skill: dnc_check
  category: compliance
  rest:
  - precallLookup
  - v1Scrub
  binding: rest
  confidence: high
  note: Returns the same first-party SUPPRESS / NO_MATCH / UNKNOWN suppression-preference scrub that POST /api/v1/outbound/lookup (single destination) and POST /api/v1/scrub (list) return, plus a signed receipt. The llms.txt states this equivalence explicitly. Not the government/licensed DNC registry.
